<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111919">
  <meta name="description" content="Step inside Roni Katcharovski’s engineering journey. Explore Ford, Tesla, and WHOOP through an interactive driveway.">
  <title>Roni Katcharovski — The Driveway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/scenes/driveway-stylized.webp" fetchpriority="high">
  <link rel="stylesheet" href="driveway.css">
  <script type="module" src="driveway.js"></script>
</head>
<body>
  <a class="skip-link" href="#car-hotspots">Skip to experiences</a>
  <main id="app" data-view="driveway" data-screen="off">
    <div class="scene" id="driveway-scene"><div class="world" id="world"><img id="driveway-image" src="assets/scenes/driveway-stylized.webp" alt="A stylized driveway with a Lincoln Nautilus marked 2024, Cybertruck marked 2025, and Cybercab marked 2026" fetchpriority="high">
      <div id="car-hotspots" class="car-hotspots" aria-label="Explore a vehicle">
        <button class="vehicle-region" data-enter="ford" aria-label="Enter Lincoln Nautilus — Ford, 2024"></button><span class="vehicle-caption caption-ford" aria-hidden="true">Ford · 2024</span>
        <button class="vehicle-region" data-enter="cybertruck" aria-label="Enter Cybertruck — Tesla, 2025"></button><span class="vehicle-caption caption-cybertruck" aria-hidden="true">Tesla · 2025</span>
        <button class="vehicle-region" data-enter="cybercab" aria-label="Enter Cybercab — Tesla, 2026"></button><span class="vehicle-caption caption-cybercab" aria-hidden="true">Tesla · 2026</span>
        <button class="driveway-prop skateboard-prop" data-open="electrium" aria-label="Explore Electrium Mobility — electric skateboard"><img src="assets/props/skateboard.png" alt="Low-poly electric skateboard"><span>Electrium Mobility</span></button>
        <button class="driveway-prop rover-prop" data-open="exceed" aria-label="Explore Exceed Robotics — rover"><img src="assets/props/rover.png" alt="Low-poly tracked robot"><span>Exceed Robotics</span></button>
      </div>
    </div></div>
    <div class="scene cabin-scene" id="cabin-scene" aria-hidden="true"><img id="cabin-image" alt=""><div class="cabin-shade"></div></div>
    <header class="site-header"><a class="identity" href="#" aria-label="Roni Katcharovski, return to driveway"><h1>Roni Katcharovski</h1><span>Computer Engineering / Waterloo</span></a><nav aria-label="Main navigation"><button data-open="about">About</button><a href="assets/resume/Roni_Katcharovski_Resume_Software_2027.pdf" target="_blank" rel="noreferrer">Résumé</a><a href="mailto:rkatchar@uwaterloo.ca">Contact</a></nav></header>
    <div class="driveway-bottom" id="driveway-bottom"><nav id="chapter-nav" class="mobile-chapters" aria-label="Choose a co-op"><button data-enter="ford">Ford <span>2024</span></button><button data-enter="cybertruck">Tesla <span>2025</span></button><button data-enter="cybercab">Tesla <span>2026</span></button><button data-open="electrium">Electrium <span>2023–24</span></button><button data-open="exceed">Exceed <span>2023</span></button></nav><footer class="scene-footer"><button data-open="experience">All experience</button><span>PERSONAL PORTFOLIO</span></footer></div>
    <section id="cabin-ui" class="cabin-ui" aria-label="Vehicle interior" hidden>
      <div class="cabin-toolbar"><button id="exit-car" class="pill-button">Back to driveway</button><p id="vehicle-label"></p><button id="next-car" class="pill-button">Next chapter</button></div>
      <button id="screen-wake" class="screen-wake" aria-label="Turn on infotainment and explore this co-op"><span class="interaction-label">Touch to explore</span></button>
      <button id="whoop-hotspot" class="whoop-hotspot" aria-label="Explore WHOOP co-op on phone"><span class="interaction-label">WHOOP · Tap to explore</span></button>
      <p class="cabin-hint" id="cabin-hint">Tap the screen for this chapter. Tap the wristband for WHOOP.</p>
    </section>
    <section id="infotainment" class="infotainment" role="dialog" aria-modal="true" aria-labelledby="screen-title" hidden><div class="screen-status"><span id="screen-brand"></span><span class="clock">9:41</span></div><div class="screen-heading"><div><h2 id="screen-title" tabindex="-1"></h2><p id="screen-kicker"></p></div><button id="screen-back">Back to cabin</button></div><div class="screen-workspace"><aside id="vehicle-panel" class="vehicle-panel"></aside><div class="screen-main"><div id="screen-content" class="screen-content" role="region" aria-labelledby="screen-title" tabindex="0"></div></div></div><div class="screen-bottom"><button data-screen-home aria-label="Back to apps">Home</button><span id="screen-app-name">Apps</span></div></section>
    <div id="transition" class="transition" aria-hidden="true"><span class="transition-line"></span><p id="transition-label"></p><button id="skip-animation" class="text-button" tabindex="-1">Skip animation</button></div>
  </main>
  <dialog id="phone-dialog" class="phone-dialog" aria-labelledby="phone-title"><button class="dialog-close phone-close" aria-label="Put phone away">×</button><div class="phone-shell"><div class="phone-status"><span class="clock">9:41</span><span class="phone-island" aria-hidden="true"></span><span aria-hidden="true">▮▮▮ ▰</span></div><div class="phone-body"><header class="phone-header"><div><p class="phone-date">BOSTON, MA · JAN — MAY 2025</p><h2 id="phone-title">WHOOP</h2></div><span class="profile-monogram">RK</span></header><p class="phone-role">Software Engineering Intern</p><div id="phone-content" role="region" aria-labelledby="phone-title" tabindex="0"></div></div><button class="phone-home" aria-label="Put phone away"><span></span></button></div></dialog>
  <dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><button class="dialog-close" aria-label="Close details">×</button><div id="info-content"></div></dialog>
  <dialog id="photo-dialog" class="photo-dialog" aria-labelledby="photo-caption"><button class="dialog-close" aria-label="Close photo">×</button><img id="full-photo" alt=""><p id="photo-caption"></p></dialog>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><div class="no-js">Enable JavaScript to explore Roni’s interactive engineering portfolio.</div></noscript>
</body>
</html>
